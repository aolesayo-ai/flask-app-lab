{% extends 'base.html' %}

{% block title %}Каталог товарів{% endblock %}

{% block content %}
<div class="container my-4">
    <h2 class="mb-4 fw-bold text-center">Каталог товарів</h2>
    
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold text-primary">{{ product.name }}</h5>
                    <p class="card-text text-muted flex-grow-1">{{ product.content }}</p>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                        <span class="fs-4 fw-bold text-success">${{ product.price }}</span>
                        <a href="{{ url_for('products.detail_product', id=product.id) }}" class="btn btn-primary btn-sm px-3">
                            Детальніше &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
