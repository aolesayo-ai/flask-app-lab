{% extends 'base.html' %}

{% block title %}Видалення поста{% endblock %}

{% block content %}
<div class="card border-danger mx-auto my-4" style="max-width: 600px;">
    <div class="card-body text-center">
        <h3 class="text-danger">Видалити пост?</h3>
        <p class="lead">Ви дійсно хочете видалити пост <strong>«{{ post.title }}»</strong>?</p>
        <p class="text-muted">Цю дію неможливо скасувати.</p>
        <form method="POST" action="{{ url_for('posts.delete_post', id=post.id) }}" class="d-flex justify-content-center gap-2">
            {{ form.hidden_tag() }}
            {{ form.submit(class="btn btn-danger") }}
            <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-outline-secondary">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
